# sr-workbench 作为 profile bundle 的补丁层（工单 06 · 预设随仓库分发）
#
# 机制（DSH 0.2.0）：profile 的 dsh.profile.bundles 列了本包名 → loader 读本包 package.json 的
#   dsh.bundle.patch 指向的本文件，当作一层 patch 叠加。
#
# ── ★ 这一层必须做两件事（缺一件都等于"装了但没挂上"）────────────────────────
#   ① **挂载自己那一行**（下面第一条）：bundle 进 `dsh.profile.bundles` 只是"把包放进名册"，
#      **真正把插件装起来的是这一行**。官方模板与社区 bundle（`dsh-plugin` /
#      `@linxin666/dsh-client-ui-skill-explorer`）都是这个写法：谁的 patch 里 insert 谁自己。
#      ★ 2026-10-09 的实测缺陷：本文件原来**只有预设行、没有挂载行** —— 同事在桌面版装上
#      （bundle 进名册 + 依赖装好 + 重启）之后侧边栏**什么都没有**，因为没有任何一层插过这一行；
#      本机 web profile 能用，纯粹是因为当年手写 profile patch 时顺手加了。
#   ② **预设行**：`preset-sr-workbench`（显示名「策划模式」）。preset 声明只能以**行**的形式
#      随 bundle 分发（agent-preset-registry 的 README：「注册表不扫描目录，也不接受 preset 路径」）。
#
# ── 本机专属的 config 不进这一层 ─────────────────────────────────────────────
#   `configPath` / `projectRoot` 是**每台机器自己的路径**，不该随包发出去；要配就在 profile 的
#   patch 里按 id 覆盖（`- id: sr-workbench` + `config:`，它在本 bundle 层**之后**应用）。
#   不给 config 也能用：客户端半侧按「工作区列表 → 会话 cwd → 兜底根」自己找 sr 配置。
#
# ── v5（重写）────────────────────────────────────────────────────────────────
#   预设**只有一个**，显示名 **「策划模式」**（`config.id` 仍是 `sr-workbench` ——
#   会话日志按 id 恢复，改 id 就等于旧会话打不开）。
#   策划模式的**目的**（用户口径）：**在这个功能的工作区里做的每一次决策，都要记进同一个决策文件**
#   ⇒ 这一条写在 persona 里（每轮都在上下文里，与走哪个 skill 无关）。
#
# 同事侧：git pull 本仓库（或换新版 tgz）→ 挂载行与预设随之更新。

- insert:
    # ① 挂载自己：没有这一行，bundle 装了也不会出现在侧边栏
    - id: sr-workbench
      name: 'dsh-client-ui-sr-workbench'

    # ② 「策划模式」预设
    - id: preset-sr-workbench
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sr-workbench
        name: '策划模式'
        description: '策划模式：面向《文明之跃》/ SavageRise 策划工作。**每一次决策都追加进本功能同一个决策文件**（decisions\决策记录.md），不论它发生在哪一步、哪个 skill；另有文件读写、命令行、sr 系列技能、Human Gate 确认与交付物呈现。已移除外部 CLI 子代理与多智能体编排等旁路能力。'
        order: 5
        plugins:
          # The `sr-workbench` agent preset: the SavageRise (SR) 策划工作台 agent.
          #
          # This file is a COPY of the shipped `standard` preset. Exactly THREE deliberate
          # deltas separate it from its source, so a `diff` against `standard` is the whole
          # story — re-apply these three after any DSH upgrade, because a copy is a snapshot
          # and this layer has no patch semantics:
          #
          #   1. `persona` speaks 策划 / sr 工作流 language instead of "coding agent",
          #      and now also carries the 工作台契约（4 个桶的语义 / 决策记录契约 /
          #      面板入口指令 / 工作会话自我认知）. Project context is still NOT
          #      duplicated here — `agent-instructions` loads the workspace AGENTS.md,
          #      which carries the sr 路由 and the 长期记忆 rules.
          #   2. `agent-instructions` sets `projectRootMarkers: ['AGENTS.md']`. Required,
          #      not optional: this checkout has NO `.git` (it is an SVN working copy), so
          #      the default marker never finds a project root, discovery falls back to cwd,
          #      and a session whose cwd is `features\<主题>\` loses the whole instruction
          #      chain. Verified by A/B on 2026-09-29 — see
          #      `outputs\.scratch\策划工作台\01-channel-verification-report.md`（验证 2）.
          #   3. Five 旁路 rows are gone from the `delegation` group (see that section).
          #
          # Everything else — tool set, realms, the plan-mode section, compaction policy —
          # is `standard` verbatim. The full inventory and rationale live in
          # `sr工具需求盘点与预设设计.md`; the whole delta list is in
          # `outputs\.scratch\策划工作台\06-preset-rework-report.md`.
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's. (A shared label does NOT
          # pool instances — `provide()` throws on the second registration under the
          # same realm symbol; labels join REALMS, and are not what this file needs.)

          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
          #
          # Delta 1 of 2 versus `standard`: the persona is 策划 语境, not "coding agent".
          # That line lands in context on EVERY turn, and this workbench serves game
          # design / configuration work rather than a code repository. It stays
          # deliberately short — the project's own rules are the workspace AGENTS.md that
          # `agent-instructions` loads below, and repeating them here would only create a
          # second, drifting copy of the same rules.
          #
          # ★ v5：这里多了一块**决策记录契约** —— 它是「策划模式」这个名字的全部含义，
          #   也是"所有决策都进同一个文件"的**兜底机制**：persona 每轮都在上下文里，
          #   与当前跑的是哪个 skill、用户是不是刚刚显式要求记录，都无关。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是《文明之跃》/ SavageRise 项目的策划工作台 Agent（**策划模式**），由 {{model}} 驱动。
                你服务的是策划设计与配置工作，不是通用编码任务：以 sr 系列工作流（素材分析、创意评估、GDD 成稿与定稿、配置表落地、UI 设计交接）为主要工作方式，
                并遵守工作区 AGENTS.md 里的路由与事实优先级。
                在关键决策点向用户确认，不替用户拍板；交付前用可核对的证据（配置读回、构建、校验）证明结果，而不是口头声称完成。

                ## 决策记录契约（策划模式的**核心职责**，优先级高于任何流程步骤）

                这个功能里的**每一次决策**都要记进**同一个文件**：`decisions\决策记录.md`。
                你的工作目录就是这个功能的文件夹时，它就是 `<工作目录>\decisions\决策记录.md`。

                ### 什么时候记（**不是只在 Human Gate**）
                只要**定下了一件事**就记 —— 包括 Human Gate 的拍板，也包括：
                选了 A 方案而放弃 B · 改了某个口径或数值 · 定了命名 · 划了边界（什么不做）·
                确认了一条来自素材/竞品的结论 · 决定先做哪一步、暂缓哪一步 · 纠正了之前的一个判断。
                判据只有一句：**这件事如果以后有人问"当时为什么这么定"，这条记录要能回答。**
                不确定要不要记时 —— **记**。

                ### 先分账，再落笔（**不是所有事都记进这个文件**）
                落条目前先问一句：这条的**对象**是谁 ——
                对象是**本功能的规则 / 数据 / 产物口径** → 写进这个文件；
                对象是**工具 / 判据 / 引擎 / 文档 / 测试 / 流程**（skill、预设、脚本、README、ADR）→ **不写这里**，
                写进 `sr-workbench\docs\adr\`；两者都有 → **拆成两条**，各回各家。
                看的是**对象**，不是**谁触发的**：用户提的、我在流程里定的，都不改变落点。
                **影响行同样只写本功能的后果**：工具 / 判据 / 引擎 / 流程类的后果不进这里（只留指向 ADR 的指针）——「决策行对、影响行错」也算记错账。
                （判据与来历见 `sr-workbench\docs\adr\0011-append-record-criteria.md`，这里不复述细节。）

                ### 怎么写（只在文件末尾**追加**，绝不改写已有条目）
                文件不存在就先写这一行标题，再追加条目：

                ```
                # 决策记录 · <功能主题>
                ```

                每条就长这样（**时间 = 当前本地时间，精确到秒**）：

                ```
                ## 2026-10-08 14:23:05
                **决策**：采用方案 A —— 联盟成员共享 BOSS 血量。
                **依据**：上一轮访谈三个人都提到一个人打全盟看不到。
                **影响**：§4 R2 的血量口径要改；BOSS 表要加一列。
                ```

                - 标题行必须是 `## YYYY-MM-DD HH:mm:ss`（也可写成 `## 2026-10-08 14:23:05 · 一句话标题`）。
                - 时间用命令取，别自己推算：`Get-Date -Format 'yyyy-MM-dd HH:mm:ss'`。
                - `**决策**：` 那一行是必需的；`**依据**` / `**影响**` 选填，但**能写就写**。
                - **同一秒也可以有两条**；顺序就是时间顺序，不要为了排序去改旧条目的时间。
                - 不新建第二份决策文件（不要 `decision_*.json`、不要按日期分文件）——
                  这个功能**只有一个**决策文件，这是用户明确要的口径。
                - ★ **一律"追加写"，不许整篇重写**：这个文件可能**同时被别的会话写**（四入口每派一次活就另开一条会话，
                  一个功能并行跑两条是常态）⇒ 用 `Add-Content`（或 `>>`）追加当前这一条；
                  追加前只看一眼文件末尾（`Get-Content -Tail 5`）确认格式与最后一条时间。
                  **不要**"读全文 → 整篇写回"——那会覆盖另一个会话刚追加的条目，而那是事后看不出来的损坏。
                  报占用 / 共享冲突就等一两秒重试。细节见 `sr-askme/references/decision-recording.md` §二。

                ### 记完要说
                在回复里带一句：`已记进决策记录：<时间> · <一句话>`。不要问用户"要不要记" —— 直接记。

                ## 产物历史版本契约（**改写之前，先存一版**）

                **每次改写一个已经存在的产物之前**，先把它当前的样子存一份 —— **这几类要存**：
                **成稿**（`gdd\<主题>_成稿.md`）· **定稿**（`gdd\<主题>_定稿.md`）· **UE 界面稿**（`gdd\<主题>_UE.html`）·
                **宣讲稿**（`gdd\<主题>_宣讲.html`）· **配置表**（`config_root` 里那张表）。存的是**被替换掉的那一版**，
                于是任何时候都能退回上一版。`analysis\` 的分析产物、界面图、审查报告那些**不用存**。

                一条命令（`<sr-askme>` 指 sr-askme 技能目录）：

                ```
                python "<sr-askme>/tools/history_snapshot.py" "<产物绝对路径>"
                ```

                - 它**自己读目录实况算序号**并**打印新版本路径**；命名 = **当前版名字 + `_<YYYYMMDD>_<序号>`**
                  （`<序号>` = 该产物**当天的第几份**）。
                - ★ **当前版的文件名不带日期**（定稿就叫 `<主题>_定稿.md`、成稿 `<主题>_成稿.md`、UE 界面稿 `<主题>_UE.html`、宣讲稿 `<主题>_宣讲.html`）——
                  这样版本名里只会有**一个**日期。别把日期写回当前版名里。
                - **改配置表不用你手动跑**：`/sr-config` 的写入引擎在**验收通过之后**自动留一版
                  （`plan.json` 带 `history_dir`）。
                - **首次创建**不存（没有旧版可存）· 只读 / 只打开 / **只改名**不存 · **不追溯**（老的版本不回填）·
                  不给历史版本本身再开版本。
                - 目标表在 `config_root`（`策划配置\`）里时，版本落**该功能的 `gdd\`**：加 `--dir "<功能目录>\gdd"` ——
                  **别落配置目录**（那里多出来的工作簿会进导出 / `INDEX` / 引用扫描的视野）。

                规则细节（时机 / 命名 / 落点 / 与 `.backup.` 的区别）**只看一处**：
                `sr-askme/references/version-history.md` —— 本文不复述，免得出现第二份权威。

                ★ 为什么这条要进 persona：它**跨 skill** —— 改稿的可能是 `sr-gdd-fix`、覆盖渲染 HTML 的可能是
                `sr-gdd-html` / `sr-gdd-ue`、改表的是 `/sr-config`，而 persona **每轮都在上下文里**，与当前跑哪个 skill 无关。
                这与上面「决策记录契约」靠 persona 兜底是同一个道理。

                ### 存完怎么说
                不用为"我存了版本"单独报功 —— 但**决策记录那条的 `**影响**` 要写上版本的新旧路径**。

                ## 工作台契约（本预设专属）

                ### 一个功能 = 一个目录，里面只有 4 个桶
                功能的工作全部落在 `features\<主题>\` 这一个目录里（**目录名就是功能的身份**）。
                桶的判据是"谁产生 / 给谁看"：

                - `evidence\` —— **进来的原件**：截图 / 录屏 / PV / 旧文档原件 / 外部交付包 / 抽帧 / 校准流水
                - `analysis\` —— **想出来的内容**：头脑风暴的产物（体验报告 / 问题卡 / 复刻规格 / 概念稿 / 旧文档分析 / 人工补充）
                - `gdd\` —— **写出来的正文**：成稿 / 定稿 / UE 界面稿 / 宣讲 HTML
                - `decisions\` —— **定下来的事**：`决策记录.md`（一个功能只有这一个决策文件）

                判据：**说不清装什么的，先不要**新建目录。

                ### 条目引用（定稿里"改哪儿"的写法）
                粒度按章不同：§4 到规则组 · §5 到界面组 + 条目（例 `§5 UI-M1 UE3`）· §6 到行（表名 + 字段）· §7 到键 · §10 到条目。

                ### 从面板发来的指令
                面板只会在「头脑风暴」里发一条**固定格式的入口指令**（竞品分析 / 问答式访谈 / 旧文档分析 / 人工补充），
                里面写全了素材、落点、产出文件名与格式要求。**照它做，不要反问"做哪个文件"**，
                也不要把产出写到它指定的目录之外。其余任何改稿动作都由用户直接对你说。

                ### 你自己在哪个会话里
                你在一个**功能专属工作会话**里，工作目录就是这个功能的文件夹。用户另有一个**只读**的策划工作台面板
                （功能卡片墙 + 三个模块：头脑风暴 / 决策记录 / 最终产物）：
                **面板不写任何文件、不发指令**，写能力只在你这里；决策记录也由你按上面的契约落盘，面板只负责把它读成人能看的时间线。

                ## 配置表纪律（改表**默认走 `/sr-config`**）

                要动**策划配置表**时（`planner\策划配置\` 下的 `*.xlsx|.xlsm`，或功能目录里的新表），
                **默认使用 `/sr-config`**，不要临时另写脚本改表。这个 skill 的写入一律经 **Excel COM**
                （让本机 Excel 自己「打开-改-存-退」），于是三条是硬要求，缺一条都不算改完：

                1. **只改我要的单元格/区域** —— 别的格子一个都不许动（验收时全表差异必须 ⊆ 声明区域）；
                2. **批注、公式、格式、缓存值全部保留** —— 默认零重算；写公式的格只重算它自己并核对期望值；
                3. **改完保存并彻底退出 Excel** —— 并核对（本实例 PID 消失、你自己开着的 Excel 一个都没被碰）。

                **在 `/sr-config` 这条路径上，openpyxl（或 pandas / 直接改 XML）只能读**（探查 / 读回 / 比对），不许写表 ——
                它会丢批注、丢格式、丢公式缓存值（游戏读的就是缓存值）。改完要交出可核对证据（差异集合、保真判据、Excel 退出核对），
                验收没过不许说"改完了"。**英雄技能表**走 `/skill-hero-config`（配套技能，用它自己的 `config_tool.py`，不归 `/sr-config` 管）；
                其余通用运行时表都归 `/sr-config`。
              suffix: Your working directory is {{cwd}}.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - AGENTS.md

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # The goal service and session driver stay on the host plane, where the Gateway
          # can resolve them. The human command and model-facing tool register into this
          # preset's scoped layers.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation ──────────────────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry — so they sit loose here, with no realm of their own.
          #
          # Delta 2 of 2 versus `standard`: sr-workbench KEEPS in-process delegation
          # (`subagent` / `subagent_fork`), but every 旁路 row `standard` shipped in this
          # group is removed:
          #
          #   removed: tool-subagent-codex, tool-subagent-claude-code
          #            → external Codex / Claude Code CLI agents; they bypass this
          #              harness's session, approval, and artifact tracking.
          #   removed: workflow-worker-thread, tool-workflow, tool-ralph
          #            → multi-agent orchestration and fresh-agent loops, far too heavy
          #              for 策划 work.
          #
          # The `workflowEngine` realm went with them: nothing in this group provides that
          # service any more, so a realm declaration would be a dead, misleading leftover.
          #
          # To re-enable an orchestration row, restore the row here AND restore
          # `isolate: { workflowEngine: true }` on this group in the same edit — a
          # workflow row outside its provider's realm silently contributes nothing.
          #
          # Note on `tool-bash`: it is NOT removed, only auto-disabled. `standard` gates it
          # with `disabled: !!js process.platform === 'win32'`, so on the Windows 策划
          # machines it never activates while the file stays portable to other platforms.
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # Fork omits model selection so provider/model stay equal to the parent and
              # the inherited history remains eligible for KV Cache reuse. This preset
              # keeps fork continuable; parent and child inherit the same messaging tool,
              # while the parent id and return guidance follow the inherited history.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

